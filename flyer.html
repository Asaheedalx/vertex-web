<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Nextgen Launch Graphic</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* This grey background just helps you see where to crop the screenshot */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e5e5e5; 
            min-height: 100vh;
        }

        /* The actual 1080x1080 Flyer Canvas */
        .flyer {
            width: 1080px;
            height: 1080px;
            background-color: #ffffff; /* Plain white background as requested */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 160px 80px 80px 80px; /* Perfect breathing room */
            box-sizing: border-box;
            text-align: center;
        }

        /* Top Section: Logo */
        .top-section {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .logo {
            width: 500px; /* Large enough for mobile, but not stretched */
            height: auto;
        }

        /* Middle Section: Tagline */
        .middle-section {
            margin-top: -60px; /* Pulls the tagline slightly up towards the logo */
        }
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            color: #222222;
            font-weight: 400; /* Regular weight, not bold */
            letter-spacing: -0.5px;
        }

        /* Bottom Section: Launch & Services */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: auto;
            margin-bottom: 80px;
        }
        .coverage-line {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            color: #333333;
            font-weight: 500;
        }
        .services-line {
            font-family: 'Inter', sans-serif;
            font-size: 26px; /* Slightly smaller than the coverage line */
            color: #666666; /* Softer color so it doesn't fight the tagline */
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Footer: Contact Info */
        .footer {
            font-family: 'Inter', sans-serif;
            font-size: 20px; /* Very small text, bottom center */
            color: #888888;
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="flyer">
        
        <div class="top-section">
            <img src="images/logo.jpg" alt="Vertex Nextgen" class="logo">
        </div>

        <div class="middle-section">
            <div class="tagline">Structured Systems for Growing Businesses</div>
        </div>

        <div class="bottom-section">
            <div class="coverage-line">Now Serving Businesses Across Oyo, Osun & Lagos</div>
            <div class="services-line">Power Backup &nbsp;|&nbsp; Network Infrastructure &nbsp;|&nbsp; Security Systems</div>
        </div>

        <div class="footer">
            vertexnextgen.com.ng &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; +234 813 948 9798
        </div>

    </div>

</body>
</html>
